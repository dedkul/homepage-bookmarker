<!doctype html><html lang="en" data-style="bento" data-theme="dark" data-bg="dusk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumen · Bento</title><link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="lumen.css">
<style>
.bento { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; max-width: 1180px; min-height: 100vh; margin: 0 auto; padding: 48px 28px; align-content: center; }
.tile { position: relative; padding: 22px 24px; border-radius: 28px; background: var(--surface); border: 1px solid var(--stroke); box-shadow: var(--shadow);
  backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); animation: rise .7s var(--ease) both; }
.tile:nth-child(2) { animation-delay: 40ms } .tile:nth-child(3) { animation-delay: 80ms } .tile:nth-child(4) { animation-delay: 120ms } .tile:nth-child(5) { animation-delay: 160ms } .tile:nth-child(6) { animation-delay: 200ms }
.tile h2 { font: 500 12px var(--sans); color: var(--fg3); margin-bottom: 14px; }
.t-search { grid-column: 1 / -1; height: 58px; border-radius: 20px; padding: 0 12px 0 22px; }
.t-clock { grid-column: span 7; min-height: 248px; display: flex; flex-direction: column; justify-content: space-between; }
.t-clock .time { font-size: clamp(84px, 9vw, 132px); font-weight: 250; margin-bottom: 10px; }
.t-zone { grid-column: span 5; display: flex; flex-direction: column; }
.t-zone [data-zone] { flex: 1; display: flex; align-items: flex-end; }
.t-zone .zone { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; height: auto; padding: 0; background: none; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; width: 100%; }
.t-zone .z-time { order: -1; flex-basis: 100%; font-size: clamp(48px, 5vw, 68px); font-weight: 250; letter-spacing: -.045em; line-height: 1; margin-bottom: 8px; }
.t-zone .z-edit { margin-left: auto; opacity: 1; }
.t-favs { grid-column: span 8; } .t-favs .favs { justify-content: space-between; }
.t-todo { grid-column: span 4; grid-row: span 2; }
.t-notes { grid-column: span 8; }
@media (max-width: 900px) { .bento > * { grid-column: 1 / -1 !important; grid-row: auto !important; } }

/* II · Mono: an instrument panel. Hairline grid, monospaced type, no blur or shadow */
[data-v="2"] { --sans: "Geist Mono", ui-monospace, monospace; --tile: rgb(22 19 17 / .84); }
[data-v="2"][data-theme=light] { --tile: rgb(250 247 242 / .88); }
[data-v="2"] body { display: grid; place-items: center; }
[data-v="2"] .bento { gap: 1px; min-height: 0; margin: 48px 28px; padding: 0; width: min(1180px, calc(100% - 56px)); background: var(--stroke); border: 1px solid var(--stroke); border-radius: 6px; overflow: hidden; }
[data-v="2"] .tile { border-radius: 0; border: 0; box-shadow: none; background: var(--tile); backdrop-filter: blur(12px); }
[data-v="2"] .tile h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
[data-v="2"] .tile h2::before { content: "● "; color: var(--accent); }
[data-v="2"] .t-search { border-radius: 0; height: 60px; }
[data-v="2"] .time { font-weight: 300; letter-spacing: -.08em; }
[data-v="2"] .ico, [data-v="2"] .box { border-radius: 4px; } [data-v="2"] .ico { box-shadow: none; }
[data-v="2"] .z-edit, [data-v="2"] .btn { border-radius: 4px; }
</style></head><body>
<main class="bento">
  <form class="search tile t-search" action="https://www.google.com/search" role="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input name="q" placeholder="Search the web" aria-label="Search the web" autocomplete="off"><kbd>/</kbd></form>
  <section class="tile t-clock"><p class="greet" data-greet></p><div><h1 class="time"><span data-time></span><span class="ap" data-ap></span></h1><p class="date" data-date></p></div></section>
  <section class="tile t-zone"><h2>Second clock</h2><div data-zone></div></section>
  <section class="tile t-favs"><h2>Favorites</h2><nav class="favs" data-favs aria-label="Favorites"></nav></section>
  <section class="tile t-todo"><h2>Today</h2><div class="todo" data-todo></div></section>
  <section class="tile t-notes"><h2>Notes</h2><div class="notes" data-notes></div></section>
</main>
<script src="lumen.js"></script></body></html>
