<!doctype html><html lang="en" data-theme="dark" data-bg="aurora"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="shared.css"><title>B · Dock</title><style>
body{display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:36px 40px}
.clock{font-size:64px}.clock-wrap{display:grid;gap:8px}
.side{display:grid;gap:12px;width:300px}
.side .world{padding:16px 20px;justify-content:space-between}
main{display:grid;place-items:center;align-content:center;gap:18px;padding:0 24px}
.greet{font-size:22px;color:var(--fg);font-weight:500}
footer{display:flex;justify-content:center;padding:0 24px 36px}
.dock{padding:16px 22px;border-radius:26px;--tile:72px;gap:12px 10px}
.dock .ico{width:52px;height:52px;border-radius:15px}
</style></head><body>
<header class="top">
  <div class="clock-wrap"><div class="clock" data-clock></div><div class="date" data-date></div></div>
  <div class="side">
    <div class="world glass" data-world></div>
    <section class="card glass"><h3>Tasks</h3><div class="todo" data-todo></div></section>
  </div>
</header>
<main><div class="greet" data-greet></div><form class="search glass" action="https://www.google.com/search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input name="q" placeholder="Search the web" aria-label="Search the web" autofocus></form></main>
<footer><nav class="favs dock glass" data-favs aria-label="Favorites"></nav></footer>
<script src="shared.js"></script></body></html>
