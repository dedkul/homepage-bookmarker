<!doctype html><html lang="en" data-theme="dark" data-bg="aurora"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="shared.css"><title>A · Focus</title><style>
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:48px 24px}
header{display:grid;justify-items:center;gap:12px;text-align:center}
.clock{font-size:clamp(80px,11vw,150px)}
.date{font-size:17px}
.world{margin-top:10px;gap:36px}.zone{justify-items:center}.zone .zbtn{justify-self:center}
.toggle{position:fixed;top:20px;right:20px;display:flex;gap:8px;align-items:center;padding:9px 14px;border-radius:999px;color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.drawer{position:fixed;top:68px;right:20px;width:300px;display:grid;gap:12px}
.drawer[hidden]{display:none}
</style></head><body>
<main>
  <header><div class="clock" data-clock></div><div class="date" data-date></div><div class="world" data-world></div></header>
  <form class="search glass" action="https://www.google.com/search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input name="q" placeholder="Search the web" aria-label="Search the web" autofocus></form>
  <nav class="favs" data-favs aria-label="Favorites"></nav>
</main>
<button class="toggle glass" type="button" onclick="drawer.hidden=!drawer.hidden" aria-controls="drawer">✓ Tasks &amp; notes</button>
<aside id="drawer" class="drawer" hidden>
  <section class="card glass"><h3>Tasks</h3><div class="todo" data-todo></div></section>
  <section class="card glass"><h3>Notes</h3><div class="notes" data-notes></div></section>
</aside>
<script src="shared.js"></script></body></html>
