<!doctype html><html lang="en" data-style="dock" data-theme="dark" data-bg="dusk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumen · Dock</title><link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="lumen.css">
<style>
.stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 40px 24px 180px; }
.hero { display: grid; justify-items: center; gap: 14px; text-align: center; transition: transform .7s var(--ease); }
.time { font-size: clamp(96px, 13vw, 190px); }
.date { font-size: 16px; } .greet { font-size: 14px; letter-spacing: .02em; }
.hero [data-zone] { margin-top: 10px; }
.search { width: min(560px, 100%); }
.dock { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 12px 14px 10px; gap: 12px 4px; border-radius: 30px;
  background: var(--surface); border: 1px solid var(--stroke); box-shadow: var(--shadow); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%);
  transition: transform .7s var(--ease), opacity .45s var(--ease); }
.dock .fav { width: 66px; --ico: 50px; }
/* macOS-style magnification: the hovered icon and its neighbours grow */
.dock .fav:hover .ico { transform: translateY(-10px) scale(1.16); }
.dock .fav:has(+ .fav:hover) .ico, .dock .fav:hover + .fav .ico { transform: translateY(-4px) scale(1.06); }
.handle { display: none; }

/* II · Horizon: time sits low on the left like a horizon line, search moves up, dock hides until needed */
[data-v="2"] .stage { align-items: flex-start; justify-content: flex-end; padding: 0 64px 64px; }
[data-v="2"] .hero { justify-items: start; text-align: left; gap: 10px; }
[data-v="2"] .time { font-size: clamp(120px, 19vw, 290px); font-weight: 150; margin-left: -.04em; }
[data-v="2"] .greet { display: none; }
[data-v="2"] .search { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); width: min(460px, calc(100% - 150px)); height: 46px; }
[data-v="2"] .dock { transform: translate(-50%, calc(100% + 40px)); opacity: 0; }
[data-v="2"] .near .dock, [data-v="2"] .dock:focus-within { transform: translateX(-50%); opacity: 1; }
[data-v="2"] .near .hero { transform: translateY(-120px); }
[data-v="2"][data-rows="2"] .near .hero { transform: translateY(-210px); }
[data-v="2"] .handle { display: block; position: fixed; left: 50%; bottom: 10px; width: 54px; height: 5px; border-radius: 5px; background: var(--fg3); transform: translateX(-50%); transition: opacity .3s; }
[data-v="2"] .near .handle { opacity: 0; }
</style></head><body>
<main class="stage">
  <header class="hero"><p class="greet" data-greet></p><h1 class="time"><span data-time></span><span class="ap" data-ap></span></h1><p class="date" data-date></p><div data-zone></div></header>
  <form class="search " action="https://www.google.com/search" role="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input name="q" placeholder="Search the web" aria-label="Search the web" autocomplete="off"><kbd>/</kbd></form>
</main>
<nav class="favs dock" data-favs aria-label="Favorites"></nav><div class="handle" aria-hidden="true"></div>
<script src="lumen.js"></script>
<script>document.onmousemove = e => document.body.classList.toggle("near", innerHeight - e.clientY < (document.body.classList.contains("near") ? 260 : 120));</script>
</body></html>
